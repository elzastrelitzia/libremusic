name: Build Minimal ffmpeg

# Builds the audio-only ffmpeg the desktop app bundles, tests that it can still
# decode every format the app might meet, and uploads the binary.
#
# The test is not optional. --disable-everything removes hundreds of components,
# and a missing one is a runtime failure, not a configure failure. Three were
# caught this way already: the fd protocol (broke all uncached playback), the mov
# demuxer, and the pcm_s16le and alac decoders.
#
# Binaries are gitignored, so the artifact here is the only copy. Download it into
# core/data/src/jvmMain/resources/native/<os>/ffmpeg to use it locally.
#
# Manual only. This compiles ffmpeg three times, once per OS, and nothing consumes the
# artifacts, so a push that touches the build script would buy 30 minutes for a check
# that matters before a release rather than on every commit.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    # Per-step "shell:" cannot hold an expression. steps.shell is the one step key left
    # out of GitHub's context-availability table, so runner.os and matrix.os are both
    # rejected there and the whole file fails to parse. defaults.run does accept matrix,
    # so the OS choice goes here and covers every run step at once.
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Windows needs a real mingw-w64 toolchain. WSL is not a substitute: it reports
      # Linux to uname, so the build script would produce an ffmpeg.exe linked against
      # glibc and every playback would fail on a machine without MSYS2 alongside it.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # ffmpeg's configure needs a shell, make, and a compiler. nasm is there so a
          # future build can drop --disable-x86asm. ffmpeg is the full one, used only to
          # generate test fixtures.
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg

      # Needed only to generate the test fixtures. The binary under test cannot
      # encode anything, by design, so it cannot make its own test inputs.
      - name: Install full ffmpeg for fixtures
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
        if: runner.os == 'Linux'
      - name: Install full ffmpeg for fixtures
        run: brew install ffmpeg
        if: runner.os == 'macOS'

      - name: Build
        env:
          # Set to a fork URL to build patched source. Nothing needs patching
          # today, so this stays empty and the official tarball is used.
          FFMPEG_REPO: ${{ vars.FFMPEG_REPO }}
          FFMPEG_REF: ${{ vars.FFMPEG_REF }}
        run: bash desktop/build-ffmpeg-minimal.sh

      - name: Test
        run: bash desktop/test-ffmpeg-minimal.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.os }}
          path: core/data/src/jvmMain/resources/native/${{ matrix.os }}/ffmpeg${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error
