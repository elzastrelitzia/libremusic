name: Android Build (Artifacts)

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Extract App Version
        id: vars
        run: |
          VERSION=$(grep "version =" build.gradle.kts | head -n 1 | sed -E 's/.*version = "(.*)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-configuration-cache
        env:
          ANDROID_RELEASE_KEYSTORE: release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          CHAQUOPY_PYTHON: python3

      - name: Rename APK for Distribution
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mv "$APK_PATH" "app/build/outputs/apk/release/pulse-v${{ steps.vars.outputs.version }}.apk"
          echo "APK_FINAL_PATH=app/build/outputs/apk/release/pulse-v${{ steps.vars.outputs.version }}.apk" >> $GITHUB_ENV

      - name: Hash APK
        run: |
          echo "$(sha256sum ${{ env.APK_FINAL_PATH }} | cut -d ' ' -f 1)" > app/build/outputs/apk/release/checksums.txt

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_PASSPHRASE }}

      - name: Sign APK
        run: gpg --detach-sign --armor "${{ env.APK_FINAL_PATH }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release
          path: |
            ${{ env.APK_FINAL_PATH }}
            ${{ env.APK_FINAL_PATH }}.asc
            app/build/outputs/apk/release/checksums.txt
          if-no-files-found: error
          retention-days: 14