org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
kotlin.compiler.execution.strategy=in-process

org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.java.installations.fromEnv=JAVA_HOME,GRADLE_JAVA_HOME
android.usesSdkInManifest.disallowed=true
org.gradle.configuration-cache=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
